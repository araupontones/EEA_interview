# Build the dashboard (dashboard/) and publish it on GitHub Pages.
#
# Runs on every push to main that changes the dashboard or the data it reads, and can be
# started by hand from the Actions tab. The data in data/processed and data/lookups is
# bundled into the app at build time, so it must be committed before pushing.
#
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".

name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/processed/**"
      - "data/lookups/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; a newer push cancels an older one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
